# Read the Docs configuration — https://docs.readthedocs.com/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
    nodejs: "20"
  commands:
    - npm ci
    - bash docs/scripts/build-docs-demos.sh
    - pip install -r docs/requirements.txt
    - sphinx-build -b html docs $READTHEDOCS_OUTPUT/html -W

formats: []
