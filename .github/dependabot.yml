version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      lxpack:
        patterns:
          - "@lxpack/*"
      lessonkit-workspace:
        patterns:
          - "@lessonkit/*"
    ignore:
      - dependency-name: "@lessonkit/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
