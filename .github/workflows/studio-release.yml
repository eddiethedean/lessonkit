name: Studio Release

on:
  push:
    tags:
      - "studio-v*"

concurrency:
  group: studio-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read
      security-events: write
      actions: read

  publish:
    name: Publish Studio packages to npm
    runs-on: ubuntu-latest
    needs: checks
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify npm authentication
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify @lessonkit-studio npm org access
        run: |
          set -euo pipefail
          if npm access get status @lessonkit-studio 2>/dev/null | grep -q read-write; then
            echo "NPM_TOKEN has read-write access to @lessonkit-studio"
            exit 0
          fi
          echo "::error::Cannot publish to @lessonkit-studio (npm returned Scope not found or no access)."
          echo ""
          echo "Create the npm organization first:"
          echo "  1. https://www.npmjs.com/org/create — organization name: lessonkit-studio"
          echo "  2. Add the npm user behind NPM_TOKEN as a member with publish rights"
          echo "     (or use an automation token created while logged into that org)"
          echo "  3. Re-run this workflow (Actions → Studio Release → Re-run failed jobs)"
          echo ""
          echo "See RELEASING.md § Publish Studio packages to npm"
          exit 1
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Set Studio package versions from tag
        run: |
          VERSION="${GITHUB_REF_NAME#studio-v}"
          if [ -z "$VERSION" ]; then
            echo "Could not parse version from tag: ${GITHUB_REF_NAME}"
            exit 1
          fi
          echo "Publishing Studio version: $VERSION"
          node scripts/release/prepare-publish.mjs studio "$VERSION"

      - name: Build Studio packages
        run: npm run build:packages

      - name: Publish Studio packages
        run: |
          publish_workspace() {
            local workspace="$1"
            local name version err
            name="$(npm pkg get name -w "$workspace" | tr -d '"')"
            version="$(npm pkg get version -w "$workspace" | tr -d '"')"
            if npm view "${name}@${version}" version 2>/dev/null | grep -Fxq "${version}"; then
              echo "Already published: ${name}@${version}"
              return 0
            fi
            err="$(mktemp)"
            if npm -w "$workspace" publish --access public 2>"$err"; then
              rm -f "$err"
              return 0
            fi
            if grep -q 'cannot publish over the previously published versions' "$err"; then
              echo "Already published (npm 403): ${name}@${version}"
              rm -f "$err"
              return 0
            fi
            if grep -q 'Scope not found' "$err"; then
              echo "::error::npm org @lessonkit-studio does not exist. Create it at https://www.npmjs.com/org/create then re-run."
            fi
            cat "$err" >&2
            rm -f "$err"
            return 1
          }
          publish_workspace @lessonkit-studio/schema
          publish_workspace @lessonkit-studio/renderer
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
