name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Checks (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Coverage
        run: npm run coverage

  docs:
    name: Docs (Sphinx)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install dependencies
        run: pip install -r docs/requirements.txt

      - name: Build HTML
        run: sphinx-build -b html docs docs/_build/html -W

  packaging:
    name: Packaging smoke (Node 20)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build packages and golden example
        run: |
          npm run build:packages
          npm run -w lessonkit-example-lxpack-golden build

      - name: Package SCORM 1.2 artifact
        run: npm run package:scorm12 -w lessonkit-example-lxpack-golden

      - name: Verify SCORM ZIP exists
        run: test -f examples/lxpack-golden/.lxpack/course/.lxpack/out/course-scorm12.zip

      - name: Package standalone artifact
        run: npm run package:standalone -w lessonkit-example-lxpack-golden

      - name: Verify standalone directory exists
        run: test -d examples/lxpack-golden/.lxpack/course/.lxpack/out/standalone

      - name: CLI package smoke (JSON)
        run: |
          cd examples/lxpack-golden
          node ../../packages/cli/dist/bin.js package --target scorm12 --json --no-build | tee /tmp/lk-cli-package.json
          node -e "const r=JSON.parse(require('fs').readFileSync('/tmp/lk-cli-package.json','utf8')); if(!r.ok) { console.error(r); process.exit(1); }"

  security-audit:
    name: Security (npm audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies
        run: npm audit --audit-level=high

  codeql:
    name: Security (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

