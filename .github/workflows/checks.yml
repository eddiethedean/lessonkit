name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Checks (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify CLI template matches source
        run: |
          npm run copy-template -w @lessonkit/cli
          git diff --exit-code packages/cli/template/vite-react

      - name: Verify monorepo template matches CLI template source
        run: |
          diff -rq templates/vite-react/src packages/cli/template/vite-react/src
          diff templates/vite-react/lessonkit.json packages/cli/template/vite-react/lessonkit.json

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Vitest 4 @vitest/coverage-v8 uses node:inspector/promises (Node 20+).
      - name: Coverage
        if: matrix.node-version == '20'
        run: npm run coverage

      - name: Storybook build
        if: matrix.node-version == '20'
        run: npm run build-storybook
        env:
          STORYBOOK_DISABLE_TELEMETRY: "1"
          STORYBOOK_ENABLE_CRASH_REPORTS: "0"
          CI: "true"

  docs:
    name: Docs (Sphinx)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build example bundles for docs
        run: bash docs/scripts/build-docs-demos.sh

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install dependencies
        run: pip install -r docs/requirements.txt

      - name: Build HTML
        run: sphinx-build -b html docs docs/_build/html -W

  packaging:
    name: Packaging smoke (Node 20)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Library skills install and validate smoke
        run: |
          bash -n library-skills/install.sh library-skills/lessonkit-author/scripts/validate.sh
          npm run build:packages
          ./library-skills/install.sh --project -C integration/fixtures/minimal-course
          bash integration/fixtures/minimal-course/.cursor/skills/lessonkit-author/scripts/validate.sh integration/fixtures/minimal-course

      - name: Build packages and golden example
        run: |
          npm run build:packages
          npm run -w lessonkit-example-lxpack-golden build

      - name: Package SCORM 1.2 artifact
        run: npm run package:scorm12 -w lessonkit-example-lxpack-golden

      - name: Verify SCORM ZIP exists
        run: test -f examples/lxpack-golden/.lxpack/course/.lxpack/out/course-scorm12.zip

      - name: Package standalone artifact
        run: npm run package:standalone -w lessonkit-example-lxpack-golden

      - name: Verify standalone directory exists
        run: test -d examples/lxpack-golden/.lxpack/course/.lxpack/out/standalone

      - name: CLI package smoke (JSON)
        run: |
          cd examples/lxpack-golden
          node ../../packages/cli/dist/bin.js package --target scorm12 --json --no-build | tee /tmp/lk-cli-package.json
          node -e "const r=JSON.parse(require('fs').readFileSync('/tmp/lk-cli-package.json','utf8')); if(!r.ok) { console.error(r); process.exit(1); }"

      - name: LXPack conformance matrix
        run: npm run conformance:lxpack

      - name: Golden package matrix
        run: npm run conformance:golden

  integration:
    name: Integration (Node 20)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build packages and CLI
        run: |
          npm run build:packages
          npm run -w @lessonkit/cli build

      - name: Integration tests
        run: npm run test:integration

  e2e:
    name: E2E (Playwright, Node 20)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build monorepo for preview and packaging
        run: npm run build

      - name: Install Playwright browsers
        run: npm exec -w @lessonkit/e2e -- playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

  security-audit:
    name: Security (npm audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies
        run: npm audit --audit-level=high

  codeql:
    name: Security (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

