name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read
      security-events: write
      actions: read

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: checks
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          scope: "@lessonkit"
          cache: npm
        env:
          # Must be set here so setup-node writes the token into .npmrc
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify npm authentication
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Set package versions from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ]; then
            echo "Could not parse version from tag: ${GITHUB_REF_NAME}"
            exit 1
          fi
          echo "Publishing @lessonkit/* version: $VERSION"
          node scripts/release/prepare-publish.mjs "$VERSION"

      - name: Build
        run: npm run build

      - name: Publish packages
        run: |
          publish_workspace() {
            local workspace="$1"
            local name version err
            name="$(npm pkg get name -w "$workspace" | tr -d '"')"
            version="$(npm pkg get version -w "$workspace" | tr -d '"')"
            if npm view "${name}@${version}" version 2>/dev/null | grep -Fxq "${version}"; then
              echo "Already published: ${name}@${version}"
              return 0
            fi
            err="$(mktemp)"
            if npm -w "$workspace" publish --access public 2>"$err"; then
              rm -f "$err"
              return 0
            fi
            if grep -q 'cannot publish over the previously published versions' "$err"; then
              echo "Already published (npm 403): ${name}@${version}"
              rm -f "$err"
              return 0
            fi
            cat "$err" >&2
            rm -f "$err"
            return 1
          }
          publish_workspace @lessonkit/core
          publish_workspace @lessonkit/xapi
          publish_workspace @lessonkit/accessibility
          publish_workspace @lessonkit/themes
          publish_workspace @lessonkit/lxpack
          publish_workspace @lessonkit/react
          publish_workspace @lessonkit/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

