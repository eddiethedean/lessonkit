name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read
      security-events: write
      actions: read

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: checks
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          scope: "@lessonkit"
          cache: npm
        env:
          # Must be set here so setup-node writes the token into .npmrc
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify npm authentication
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Set package versions from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ]; then
            echo "Could not parse version from tag: ${GITHUB_REF_NAME}"
            exit 1
          fi
          echo "Publishing version: $VERSION"
          for pkg in packages/*/package.json; do
            npm pkg set "version=${VERSION}" --prefix "$(dirname "$pkg")"
          done
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const versionRaw = process.env.VERSION;
          const version =
            typeof versionRaw === "string" && versionRaw.startsWith("v") ? versionRaw.slice(1) : versionRaw;
          const root = process.cwd();
          const packagesDir = path.join(root, "packages");
          const packageDirs = fs
            .readdirSync(packagesDir, { withFileTypes: true })
            .filter((d) => d.isDirectory())
            .map((d) => path.join(packagesDir, d.name));

          for (const dir of packageDirs) {
            const pkgPath = path.join(dir, "package.json");
            const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
            let changed = false;
            for (const field of ["dependencies", "devDependencies", "peerDependencies", "optionalDependencies"]) {
              const deps = pkg[field];
              if (!deps) continue;
              for (const [name, val] of Object.entries(deps)) {
                if (name.startsWith("@lessonkit/") && typeof val === "string") {
                  deps[name] = version;
                  changed = true;
                }
              }
            }
            if (changed) {
              fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + "\n");
            }
          }
          NODE
        env:
          VERSION: ${{ github.ref_name }}

      - name: Build
        run: npm run build

      - name: Publish packages
        run: |
          publish_workspace() {
            local workspace="$1"
            local name version err
            name="$(npm pkg get name -w "$workspace" | tr -d '"')"
            version="$(npm pkg get version -w "$workspace" | tr -d '"')"
            if npm view "${name}@${version}" version 2>/dev/null | grep -Fxq "${version}"; then
              echo "Already published: ${name}@${version}"
              return 0
            fi
            err="$(mktemp)"
            if npm -w "$workspace" publish --access public 2>"$err"; then
              rm -f "$err"
              return 0
            fi
            if grep -q 'cannot publish over the previously published versions' "$err"; then
              echo "Already published (npm 403): ${name}@${version}"
              rm -f "$err"
              return 0
            fi
            cat "$err" >&2
            rm -f "$err"
            return 1
          }
          publish_workspace @lessonkit/core
          publish_workspace @lessonkit/xapi
          publish_workspace @lessonkit/react
          publish_workspace @lessonkit/accessibility
          publish_workspace @lessonkit/themes
          publish_workspace @lessonkit/lxpack
          publish_workspace @lessonkit/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

