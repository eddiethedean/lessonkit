name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: checks
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          scope: "@lessonkit"
          cache: npm
        env:
          # Must be set here so setup-node writes the token into .npmrc
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify npm authentication
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Set package versions from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ]; then
            echo "Could not parse version from tag: ${GITHUB_REF_NAME}"
            exit 1
          fi
          echo "Publishing version: $VERSION"
          for pkg in packages/*/package.json; do
            npm pkg set "version=${VERSION}" --prefix "$(dirname "$pkg")"
          done
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const versionRaw = process.env.VERSION;
          const version =
            typeof versionRaw === "string" && versionRaw.startsWith("v") ? versionRaw.slice(1) : versionRaw;
          const root = process.cwd();
          const packagesDir = path.join(root, "packages");
          const packageDirs = fs
            .readdirSync(packagesDir, { withFileTypes: true })
            .filter((d) => d.isDirectory())
            .map((d) => path.join(packagesDir, d.name));

          for (const dir of packageDirs) {
            const pkgPath = path.join(dir, "package.json");
            const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
            let changed = false;
            for (const field of ["dependencies", "devDependencies", "peerDependencies", "optionalDependencies"]) {
              const deps = pkg[field];
              if (!deps) continue;
              for (const [name, val] of Object.entries(deps)) {
                if (name.startsWith("@lessonkit/") && typeof val === "string") {
                  deps[name] = version;
                  changed = true;
                }
              }
            }
            if (changed) {
              fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + "\n");
            }
          }
          NODE
        env:
          VERSION: ${{ github.ref_name }}

      - name: Build
        run: npm run build

      - name: Publish packages
        run: |
          npm -w @lessonkit/core publish --access public
          npm -w @lessonkit/xapi publish --access public
          npm -w @lessonkit/react publish --access public
          npm -w @lessonkit/accessibility publish --access public
          npm -w @lessonkit/themes publish --access public
          npm -w @lessonkit/lxpack publish --access public
          npm -w @lessonkit/cli publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

