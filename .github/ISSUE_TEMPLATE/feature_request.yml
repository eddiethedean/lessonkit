name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Who is affected?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the API, UX, or workflow you would like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you considered, or workarounds today.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Package or area
      options:
        - react
        - core
        - cli
        - lxpack
        - xapi
        - studio
        - docs
        - other
    validations:
      required: true
