<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">LessonKit Logo</title>
  <desc id="desc">Abstract LessonKit mark inspired by the uploaded banner: a dark navy angular L shape with cyan and purple gradient accents forming a K-like shape.</desc>
  <defs>
    <linearGradient id="navy" x1="120" y1="56" x2="250" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#071E57"/>
      <stop offset="1" stop-color="#020B2E"/>
    </linearGradient>
    <linearGradient id="cyan" x1="205" y1="100" x2="360" y2="215" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1DD8E8"/>
      <stop offset="1" stop-color="#2F7BFF"/>
    </linearGradient>
    <linearGradient id="accent" x1="166" y1="345" x2="414" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14C6F3"/>
      <stop offset="0.48" stop-color="#2E7BFF"/>
      <stop offset="1" stop-color="#8B35F6"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#061440" flood-opacity="0.16"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <!-- left LessonKit L stroke -->
    <path d="M109 371V160c0-11 4.4-21.6 12.2-29.4L190 62c11.7-11.7 31.8-3.4 31.8 13.1v46.7c0 4.9-1.9 9.6-5.4 13L172 179.1v158.5c0 5.1-2 9.9-5.6 13.5l-31.7 31.7C125.2 392.3 109 385.6 109 371Z" fill="url(#navy)"/>

    <!-- inner dark angled stem -->
    <path d="M197 302V181.6c0-5 2-9.8 5.6-13.4l39.3-39.3c11.3-11.3 30.6-3.3 30.6 12.7v45.7c0 4.8-1.9 9.4-5.3 12.8l-32.1 32.1v53.9c0 5.3-2.1 10.3-5.8 14l-19.4 19.4c-5.4 5.4-14.9 1.6-14.9-6Z" fill="#071E57"/>

    <!-- cyan upper K arm -->
    <path d="M245.5 172.7 334.3 84c6.2-6.2 16.8-1.8 16.8 7v59.2c0 4.7-1.9 9.2-5.2 12.5l-69.1 69.1c-3.4 3.4-8.1 5.4-12.9 5.4H217c-15.8 0-23.8-19.1-12.6-30.3l41.1-34.2Z" fill="url(#cyan)"/>

    <!-- lower gradient base / K arm -->
    <path d="M184 372 327 229c11.3-11.3 30.7-3.3 30.7 12.7v57.4c0 4.8-1.9 9.4-5.3 12.8l-74.2 74.2c-7.9 7.9-18.6 12.4-29.8 12.4h-68.9c-16 0-24-19.3-12.7-30.6L184 372Z" fill="url(#accent)"/>
  </g>
</svg>
